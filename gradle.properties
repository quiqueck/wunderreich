# Parent of the FIRST commit on release/1.21.6, so it reads as a diff instead of a
# full import; later releases sit on the previous release commit. Everything
# reachable from this ref becomes part of the public release branch, which is why
# this is origin/1.21.6 - the already-published tip - and not the local branch: the
# local-only 1.21.6 commits then ship as content in one release commit rather than
# as individual commits with their own messages.
previous_release_branch=origin/1.21.6
#`release`, `beta` or `alpha`
release_channel=beta
