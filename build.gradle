plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

apply from: "common-fabric-project.gradle"

repositories {
    maven { url = "https://maven.shedaniel.me" }
    maven { url = "https://maven.bai.lol" }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.ambertation.de/releases' }
    flatDir { dirs 'libs' }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/wunderreich.accesswidener")
}

dependencies {
    // Optional-integration mods are published against older Minecraft versions than we target, so each of
    // them drags in an older fabric-api. Loom applies the class tweakers of every mod on the classpath to the
    // Minecraft jar, and an older fabric-api's tweakers reference signatures that no longer exist (e.g. the
    // 26.1 datagen module injects FabricTagAppender<E,T> into what is now TagAppender<T>, failing the build
    // with "Failed to setup Minecraft"). We declare the matching fabric-api ourselves in
    // common-fabric-project.gradle, so strip theirs.
    def noFabricApi = { exclude group: "net.fabricmc.fabric-api" }

    // REI and WTHIT are disabled for 26.3: neither has published a compatible build (REI tops out at 26.2,
    // WTHIT at 26.1), and REI's newest jar hard-depends on `minecraft ~26.2`, so Fabric Loader refuses to
    // start the dev runtime with it present. Disabled the same way EMI is below; re-enable once they ship
    // 26.3 builds (also flip the *_disabled entrypoints in fabric.mod.json back and re-add them to
    // optional_dependencies in gradle.properties).
//    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}", noFabricApi) // compile against the API
//    compileOnly "me.shedaniel.cloth:basic-math:0.6.1" // me.shedaniel.math.Point/Rectangle used by the REI GUI API
//    compileOnly("dev.architectury:architectury-fabric:20.0.6", noFabricApi)
//    // dev.architectury.fluid.FluidStack referenced by REI EntryStacks/EntryIngredients overloads
//    localRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}", noFabricApi)
//    // run against the full jar (pulls basic-math transitively)

    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}", noFabricApi)
    localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}", noFabricApi)

//    compileOnly("mcp.mobius.waila:wthit-api:fabric-${project.wthit_version}", noFabricApi) // compile against the API
//    localRuntime "mcp.mobius.waila:wthit:fabric-${project.wthit_version}" // run against the full jar

//    compileOnly "dev.emi:emi-fabric:${emi_version}:api"
//    localRuntime "dev.emi:emi-fabric:${emi_version}"

    gradle.modApiOrLocal(dependencies, ':wunderlib', "de.ambertation:wunderlib:${project.wunderlib_version}")
}

apply from: "common-helper.gradle"
apply from: "common-publish-tag.gradle"

allprojects {
    // Allow 400 errors.
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "5000"
            //<< "-Xlint:rawtypes"
            //<< "-Xlint:unchecked"
            //<< "-Xlint:deprecation"
        }
    }
}
