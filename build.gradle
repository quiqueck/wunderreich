plugins {
    id 'fabric-loom' version "${loom_version}"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

apply from: "common-fabric-project.gradle"

repositories {
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://maven.architectury.dev" }
    maven { url "https://maven.bai.lol" }
    maven { url 'https://maven.terraformersmc.com/releases' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.ambertation.de/releases' }
    flatDir { dirs 'libs' }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/wunderreich.accesswidener")

    splitEnvironmentSourceSets()

    mods {
        wunderreich {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}" // compile against the API
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1" // me.shedaniel.math.Point/Rectangle used by the REI GUI API
    modCompileOnly "dev.architectury:architectury-fabric:17.0.8" // dev.architectury.fluid.FluidStack referenced by REI EntryStacks/EntryIngredients overloads
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}" // run against the full jar (pulls basic-math transitively)

    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    modCompileOnly "mcp.mobius.waila:wthit-api:fabric-${project.wthit_version}" // compile against the API
    modLocalRuntime "mcp.mobius.waila:wthit:fabric-${project.wthit_version}" // run against the full jar

//    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
//    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    gradle.modApiOrLocal(dependencies, ':wunderlib', "de.ambertation:wunderlib:${project.wunderlib_version}")
}

apply from: "common-helper.gradle"
apply from: "common-publish-tag.gradle"

allprojects {
    // Allow 400 errors.
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "5000"
            //<< "-Xlint:rawtypes"
            //<< "-Xlint:unchecked"
            //<< "-Xlint:deprecation"
        }
    }
}
