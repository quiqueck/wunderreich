plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://maven.bai.lol" }
    maven { url 'https://maven.terraformersmc.com/releases' }
    maven { url 'https://jitpack.io' }
    flatDir { dirs 'libs' }
}

loom {
    accessWidenerPath = file("src/main/resources/wunderreich.accesswidener")
}

sourceSets {
    // Test-only mod. Never shipped: it is its own fabric mod (see src/testmod/resources/fabric.mod.json)
    // and is only ever put on the classpath by the `gametest` run below, so nothing here ends up in the
    // release jar.
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    runs {
        // Headless Fabric GameTest run: boots a dedicated server, executes every @GameTest in
        // src/testmod, writes a JUnit-style report.xml and exits non-zero if any test failed.
        // Usage: `./gradlew :runGametest`
        gametest {
            server()
            name "GameTest"
            runDir "build/gametest"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/report.xml")}"
            source sourceSets.testmod
            ideConfigGenerated true
        }
    }

    // The testmod has to be its own mod entry or the loader would see two fabric.mod.json files on a
    // single mod path.
    mods {
        register("wunderreich") {
            sourceSet sourceSets.main
        }
        register("wunderreich-testmod") {
            sourceSet sourceSets.testmod
        }
    }
}

dependencies {
    // The testmod compiles and runs against the mod itself.
    testmodImplementation sourceSets.main.output

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    //modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    modCompileOnly "mcp.mobius.waila:wthit-api:fabric-${project.wthit_version}" // compile against the API
    modLocalRuntime "mcp.mobius.waila:wthit:fabric-${project.wthit_version}" // run against the full jar

    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    gradle.modApiOrLocal(dependencies, ':wunderlib', "com.github.quiqueck:WunderLib:${project.wunderlib_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

apply from: "common-helper.gradle"
apply from: "common-publish-tag.gradle"
